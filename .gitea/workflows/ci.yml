---
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: immich-rs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: docker
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Restore the pinned Rust toolchain cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.rustup/toolchains/1.88.0-x86_64-unknown-linux-gnu
            ~/.rustup/update-hashes/1.88.0-x86_64-unknown-linux-gnu
          key: rustup-linux-x86-64-1.88.0
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Validate architecture records
        run: |
          scripts/check-adrs.sh
          python3 scripts/check-loc.py
      - name: Validate synthetic fixtures and repository safety
        run: |
          python3 scripts/check-fixtures.py
          python3 -m unittest discover -s tests/tooling -p 'test_*.py'
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-targets
      - run: cargo doc --locked --workspace --no-deps
      - name: Prove scaffold fails closed
        run: |
          cargo run --locked -p immich-rs-cli -- --version
          if cargo run --locked -p immich-rs-cli; then
            echo "scaffold unexpectedly accepted a media command" >&2
            exit 1
          fi

  dependency-policy:
    runs-on: docker
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Restore the pinned Rust toolchain cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.rustup/toolchains/1.88.0-x86_64-unknown-linux-gnu
            ~/.rustup/update-hashes/1.88.0-x86_64-unknown-linux-gnu
          key: rustup-linux-x86-64-1.88.0
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2,cargo-audit@0.22.2
      - run: cargo deny check
      - run: cargo audit --deny warnings

  differential:
    runs-on: docker
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Restore the pinned oracle cache
        uses: actions/cache@v4
        with:
          path: .cache/oracle
          key: immich-go-v0.32.0-linux-x86-64-6e2ad86b
      - name: Fetch and verify the official oracle on cache miss
        run: python3 scripts/fetch-oracle.py
      - name: Run the normalized black-box differential
        run: |
          mkdir -p .artifacts/oracle
          python3 scripts/run-oracle.py \
            tests/oracle/cases/folder-matrix-v1.json \
            --oracle .cache/oracle/immich-go-0.32.0-linux-x86_64/immich-go \
            --output .artifacts/oracle/observation.json
          python3 scripts/compare-oracle.py \
            tests/oracle/compatibility/folder-matrix-v1.json \
            .artifacts/oracle/observation.json \
            --output .artifacts/oracle/differential-report.json
      - name: Preserve normalized evidence without redistributing the oracle
        uses: actions/upload-artifact@v4
        with:
          name: phase1-differential-${{ github.sha }}
          path: .artifacts/oracle
          retention-days: 14
