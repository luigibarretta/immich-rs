---
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: immich-rs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: docker
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Restore the pinned Rust toolchain cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.rustup/toolchains/1.88.0-x86_64-unknown-linux-gnu
            ~/.rustup/update-hashes/1.88.0-x86_64-unknown-linux-gnu
          key: rustup-linux-x86-64-1.88.0
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Validate architecture records
        run: |
          scripts/check-adrs.sh
          python3 scripts/check-loc.py
      - name: Validate synthetic fixtures and repository safety
        run: |
          python3 scripts/check-fixtures.py
          python3 -m unittest discover -s tests/tooling -p 'test_*.py'
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-targets
      - run: cargo doc --locked --workspace --no-deps
      - name: Prove scaffold fails closed
        run: |
          cargo run --locked -p immich-rs-cli -- --version
          if cargo run --locked -p immich-rs-cli; then
            echo "scaffold unexpectedly accepted a media command" >&2
            exit 1
          fi

  dependency-policy:
    runs-on: docker
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Restore the pinned Rust toolchain cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.rustup/toolchains/1.88.0-x86_64-unknown-linux-gnu
            ~/.rustup/update-hashes/1.88.0-x86_64-unknown-linux-gnu
          key: rustup-linux-x86-64-1.88.0
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2,cargo-audit@0.22.2
      - run: cargo deny check
      - run: cargo audit --deny warnings
