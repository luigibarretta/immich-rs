---
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: immich-rs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: docker
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore the pinned Rust toolchain cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.rustup/toolchains/1.88.0-x86_64-unknown-linux-gnu
            ~/.rustup/update-hashes/1.88.0-x86_64-unknown-linux-gnu
          key: rustup-linux-x86-64-1.88.0
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Validate architecture records
        run: |
          scripts/check-adrs.sh
          python3 scripts/check-architecture.py
          python3 scripts/check-benchmark-evidence.py
          python3 scripts/check-disposable-evidence.py
          python3 scripts/check-phase5-evidence.py
          python3 scripts/check-phase6-evidence.py
          python3 scripts/check-production-evidence.py
          python3 scripts/check-phase8-evidence.py
          python3 scripts/check-phase8-benchmark.py
          python3 scripts/check-release.py
          python3 scripts/check-container.py
          python3 scripts/check-loc.py
      - name: Validate synthetic fixtures and repository safety
        run: |
          python3 scripts/check-fixtures.py
          python3 -m unittest discover -s tests/tooling -p 'test_*.py'
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-targets
      - run: cargo doc --locked --workspace --no-deps
      - name: Prove the CLI fails closed without a command
        run: |
          cargo run --locked -p immich-rs-cli -- --version
          if cargo run --locked -p immich-rs-cli; then
            echo "CLI unexpectedly accepted a missing command" >&2
            exit 1
          fi

  container-amd64:
    runs-on: docker
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Compose and the static container contract
        run: |
          python3 scripts/check-container.py
          docker compose config --quiet
          IMMICH_RS_API_KEY_PATH=/dev/null docker compose \
            -f compose.yaml -f deploy/compose.production.yaml config --quiet
      - name: Build and run the hardened amd64 image twice
        run: |
          set -eu
          IMAGE="immich-rs-ci:${{ github.sha }}"
          chmod 0755 deploy deploy/example-source
          chmod 0644 deploy/immich-rs.example.toml deploy/example-source/synthetic-container.jpg
          mkdir -p .artifacts/container
          WORKSPACE_VOLUME=$(docker inspect "$HOSTNAME" | python3 -c '
          import json, os, sys
          checkout = os.environ["PWD"]
          matches = [mount.get("Name", "") for mount in json.load(sys.stdin)[0]["Mounts"]
                     if mount["Destination"] == checkout and mount["Type"] == "volume"]
          if len(matches) != 1 or not matches[0]:
              raise SystemExit("checkout must be backed by exactly one named volume")
          print(matches[0])')
          test -n "$WORKSPACE_VOLUME"
          docker buildx build --load --platform linux/amd64 \
            --build-arg "VCS_REF=${{ github.sha }}" \
            --tag "$IMAGE" --file Containerfile .
          test "$(docker image inspect "$IMAGE" --format '{{.Config.User}}')" = "65532:65532"
          for output in first second; do
            docker run --rm --network none --read-only --user 65532:65532 \
              --cap-drop ALL --security-opt no-new-privileges --pids-limit 128 \
              --tmpfs /tmp:rw,noexec,nosuid,nodev,size=16m \
              -e "IMMICH_RS_CONFIG=$PWD/deploy/immich-rs.example.toml" \
              -e "IMMICH_RS_SOURCE=$PWD/deploy/example-source" \
              -v "$WORKSPACE_VOLUME:$PWD:ro" \
              "$IMAGE" plan folder > ".artifacts/container/$output.json"
          done
          cmp .artifacts/container/first.json .artifacts/container/second.json
          IMMICH_RS_IMAGE="$IMAGE" docker compose run --rm \
            -e "IMMICH_RS_CONFIG=$PWD/deploy/immich-rs.example.toml" \
            -e "IMMICH_RS_SOURCE=$PWD/deploy/example-source" \
            -v "$WORKSPACE_VOLUME:$PWD:ro" immich-rs \
            > .artifacts/container/compose.json
          cmp .artifacts/container/first.json .artifacts/container/compose.json
      - name: Remove exact test-only container resources
        if: always()
        run: |
          IMMICH_RS_IMAGE="immich-rs-ci:${{ github.sha }}" \
            docker compose down --volumes --remove-orphans || true
          docker image rm "immich-rs-ci:${{ github.sha }}" || true

  dependency-policy:
    runs-on: docker
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Restore the pinned Rust toolchain cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.rustup/toolchains/1.88.0-x86_64-unknown-linux-gnu
            ~/.rustup/update-hashes/1.88.0-x86_64-unknown-linux-gnu
          key: rustup-linux-x86-64-1.88.0
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2,cargo-audit@0.22.2
      - run: cargo deny check
      - run: cargo audit --deny warnings

  differential:
    runs-on: docker
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore the pinned Rust toolchain cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.rustup/toolchains/1.88.0-x86_64-unknown-linux-gnu
            ~/.rustup/update-hashes/1.88.0-x86_64-unknown-linux-gnu
          key: rustup-linux-x86-64-1.88.0
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Restore the pinned oracle cache
        uses: actions/cache@v4
        with:
          path: .cache/oracle
          key: immich-go-v0.32.0-linux-x86-64-6e2ad86b
      - name: Fetch and verify the official oracle on cache miss
        run: python3 scripts/fetch-oracle.py
      - name: Build the migration differential subject
        run: cargo build --locked -p immich-rs-cli
      - name: Run the normalized black-box differential
        run: |
          mkdir -p .artifacts/oracle
          python3 scripts/run-oracle.py \
            tests/oracle/cases/folder-matrix-v1.json \
            --oracle .cache/oracle/immich-go-0.32.0-linux-x86_64/immich-go \
            --output .artifacts/oracle/observation.json
          python3 scripts/compare-oracle.py \
            tests/oracle/compatibility/folder-matrix-v1.json \
            .artifacts/oracle/observation.json \
            --output .artifacts/oracle/differential-report.json
          python3 scripts/run-oracle.py \
            tests/oracle/cases/google-takeout-basic-v1.json \
            --oracle .cache/oracle/immich-go-0.32.0-linux-x86_64/immich-go \
            --output .artifacts/oracle/google-takeout-observation.json
          python3 scripts/compare-takeout-oracle.py \
            tests/oracle/compatibility/google-takeout-basic-v1.json \
            .artifacts/oracle/google-takeout-observation.json \
            --output .artifacts/oracle/google-takeout-report.json
          python3 scripts/run-oracle.py \
            tests/oracle/cases/google-takeout-complete-v2.json \
            --oracle .cache/oracle/immich-go-0.32.0-linux-x86_64/immich-go \
            --output .artifacts/oracle/google-takeout-complete-observation.json
          python3 scripts/compare-takeout-complete.py \
            tests/oracle/compatibility/google-takeout-complete-v2.json \
            .artifacts/oracle/google-takeout-complete-observation.json \
            --output .artifacts/oracle/google-takeout-complete-report.json
          python3 scripts/run-oracle.py \
            tests/oracle/cases/apple-photos-v3.json \
            --oracle .cache/oracle/immich-go-0.32.0-linux-x86_64/immich-go \
            --output .artifacts/oracle/apple-photos-observation.json
          python3 scripts/compare-apple-oracle.py \
            tests/oracle/compatibility/apple-photos-v3.json \
            .artifacts/oracle/apple-photos-observation.json \
            --output .artifacts/oracle/apple-photos-report.json
          python3 scripts/run-oracle.py \
            tests/oracle/cases/picasa-directory-v4.json \
            --oracle .cache/oracle/immich-go-0.32.0-linux-x86_64/immich-go \
            --output .artifacts/oracle/picasa-directory-observation.json
          python3 scripts/run-oracle.py \
            tests/oracle/cases/picasa-v4.json \
            --oracle .cache/oracle/immich-go-0.32.0-linux-x86_64/immich-go \
            --output .artifacts/oracle/picasa-zip-observation.json
          python3 scripts/compare-picasa-oracle.py \
            tests/oracle/compatibility/picasa-v4.json \
            .artifacts/oracle/picasa-directory-observation.json \
            .artifacts/oracle/picasa-zip-observation.json \
            --output .artifacts/oracle/picasa-report.json
          python3 scripts/run-import-differential.py \
            tests/oracle/compatibility/apple-import-v1.json \
            --oracle .cache/oracle/immich-go-0.32.0-linux-x86_64/immich-go \
            --immich-rs target/debug/immich-rs \
            --output .artifacts/oracle/apple-import-report.json
          python3 scripts/run-import-differential.py \
            tests/oracle/compatibility/picasa-import-v1.json \
            --oracle .cache/oracle/immich-go-0.32.0-linux-x86_64/immich-go \
            --immich-rs target/debug/immich-rs \
            --output .artifacts/oracle/picasa-import-report.json
          python3 scripts/run-migration-differential.py \
            tests/oracle/compatibility/immich-migration-v1.json \
            --oracle .cache/oracle/immich-go-0.32.0-linux-x86_64/immich-go \
            --immich-rs target/debug/immich-rs \
            --output .artifacts/oracle/immich-migration-report.json
      - name: Preserve normalized evidence without redistributing the oracle
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: read-only-differential-${{ github.sha }}
          path: .artifacts/oracle
          retention-days: 14
