---
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: immich-rs-${{ github.ref }}
  cancel-in-progress: true

# Checks come from ci-local.json through the vendored ci-local runner, the same
# entry point used before a push (`node third_party/repo-tooling/ci-local.mjs
# --quick`, then the full gate). Every manifest step runs in exactly one call
# below (scripts/check-ci-local-jobs.py). Plain workflow steps are CI-only:
# checkouts, toolchains, caches, tool installation, the hardened
# image builds and runs, their cleanup and artifact upload.
jobs:
  quality:
    runs-on: docker
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      # CI-only: the checkout of the commit pinned in
      # dependencies/repo-tooling.sha that the repo-tooling-sync step compares
      # third_party/repo-tooling with.
      - name: Checkout pinned repository tooling
        uses: actions/checkout@v4
        with:
          repository: luigibarretta/repo-tooling
          ref: b8ee6b7218d4d01c90403d1d24826006242a6a23
          path: .ci/repo-tooling
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore the pinned Rust toolchain cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.rustup/toolchains/1.96.1-x86_64-unknown-linux-gnu
            ~/.rustup/update-hashes/1.96.1-x86_64-unknown-linux-gnu
          key: rustup-linux-x86-64-1.96.1
      - uses: dtolnay/rust-toolchain@3f2778ee6a28c53e512b95bbcf7b2120993da70d # 1.96.1
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Repository tooling, architecture, evidence, release, LOC, NASA, fixture and tooling checks
        run: node third_party/repo-tooling/ci-local.mjs --ci --only repo-tooling-sync,vendored-deps,ci-local-jobs,adrs,architecture,evidence,release-checks,loc,nasa,fixtures,tooling-tests
      - name: Rust format, lint, tests, docs and the fail-closed CLI
        run: node third_party/repo-tooling/ci-local.mjs --ci --only rust-fmt,clippy,rust-test,rust-doc,cli-fail-closed

  container-amd64:
    runs-on: docker
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Compose and the static container contract
        run: node third_party/repo-tooling/ci-local.mjs --ci --only container-contract
      # CI-only from here on in this job: the hardened image builds and runs
      # (never in the local gate) and the exact test-resource cleanup.
      - name: Build and run the hardened amd64 image twice
        run: |
          set -eu
          IMAGE="immich-rs-ci:${{ github.sha }}"
          chmod 0755 deploy deploy/example-source
          chmod 0644 deploy/immich-rs.example.toml deploy/example-source/synthetic-container.jpg
          mkdir -p .artifacts/container
          WORKSPACE_VOLUME=$(docker inspect "$HOSTNAME" | python3 -c '
          import json, os, sys
          checkout = os.environ["PWD"]
          matches = [mount.get("Name", "") for mount in json.load(sys.stdin)[0]["Mounts"]
                     if mount["Destination"] == checkout and mount["Type"] == "volume"]
          if len(matches) != 1 or not matches[0]:
              raise SystemExit("checkout must be backed by exactly one named volume")
          print(matches[0])')
          test -n "$WORKSPACE_VOLUME"
          docker buildx build --load --platform linux/amd64 \
            --build-arg "VCS_REF=${{ github.sha }}" \
            --tag "$IMAGE" --file Containerfile .
          test "$(docker image inspect "$IMAGE" --format '{{.Config.User}}')" = "65532:65532"
          for output in first second; do
            docker run --rm --network none --read-only --user 65532:65532 \
              --cap-drop ALL --security-opt no-new-privileges --pids-limit 128 \
              --tmpfs /tmp:rw,noexec,nosuid,nodev,size=16m \
              -e "IMMICH_RS_CONFIG=$PWD/deploy/immich-rs.example.toml" \
              -e "IMMICH_RS_SOURCE=$PWD/deploy/example-source" \
              -v "$WORKSPACE_VOLUME:$PWD:ro" \
              "$IMAGE" plan folder > ".artifacts/container/$output.json"
          done
          cmp .artifacts/container/first.json .artifacts/container/second.json
          IMMICH_RS_IMAGE="$IMAGE" docker compose run --rm \
            -e "IMMICH_RS_CONFIG=$PWD/deploy/immich-rs.example.toml" \
            -e "IMMICH_RS_SOURCE=$PWD/deploy/example-source" \
            -v "$WORKSPACE_VOLUME:$PWD:ro" immich-rs \
            > .artifacts/container/compose.json
          cmp .artifacts/container/first.json .artifacts/container/compose.json
      - name: Build and run the separate hardened Web Console image twice
        run: scripts/test-web-container.sh --revision "${{ github.sha }}"
      - name: Remove exact test-only container resources
        if: always()
        run: |
          IMMICH_RS_IMAGE="immich-rs-ci:${{ github.sha }}" \
            docker compose down --volumes --remove-orphans || true
          docker image rm "immich-rs-ci:${{ github.sha }}" || true

  dependency-policy:
    runs-on: docker
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Restore the pinned Rust toolchain cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.rustup/toolchains/1.96.1-x86_64-unknown-linux-gnu
            ~/.rustup/update-hashes/1.96.1-x86_64-unknown-linux-gnu
          key: rustup-linux-x86-64-1.96.1
      - uses: dtolnay/rust-toolchain@3f2778ee6a28c53e512b95bbcf7b2120993da70d # 1.96.1
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2,cargo-audit@0.22.2
      - name: cargo-deny and the RustSec audit of every Cargo.lock
        run: node third_party/repo-tooling/ci-local.mjs --ci --only cargo-deny,audit-lockfiles

  differential:
    runs-on: docker
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore the pinned Rust toolchain cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.rustup/toolchains/1.96.1-x86_64-unknown-linux-gnu
            ~/.rustup/update-hashes/1.96.1-x86_64-unknown-linux-gnu
          key: rustup-linux-x86-64-1.96.1
      - uses: dtolnay/rust-toolchain@3f2778ee6a28c53e512b95bbcf7b2120993da70d # 1.96.1
      - uses: Swatinem/rust-cache@v2
      - name: Restore the pinned oracle cache
        uses: actions/cache@v4
        with:
          path: .cache/oracle
          key: immich-go-v0.32.0-linux-x86-64-6e2ad86b
      - name: Fetch the oracle, build the subject and run the normalized black-box differential
        run: node third_party/repo-tooling/ci-local.mjs --ci --only oracle-fetch,differential-build,differential
      - name: Preserve normalized evidence without redistributing the oracle
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: read-only-differential-${{ github.sha }}
          path: .artifacts/oracle
          retention-days: 14
