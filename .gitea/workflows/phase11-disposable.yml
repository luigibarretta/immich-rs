---
name: phase11-disposable-migration

on:
  workflow_dispatch:
  push:
    tags:
      - phase11-disposable-*

concurrency:
  group: immich-rs-phase11-disposable-migration
  cancel-in-progress: false

jobs:
  two-server-migration:
    runs-on: docker
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore the pinned Rust toolchain cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.rustup/toolchains/1.88.0-x86_64-unknown-linux-gnu
            ~/.rustup/update-hashes/1.88.0-x86_64-unknown-linux-gnu
          key: rustup-linux-x86-64-1.88.0
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Restore the pinned oracle cache
        uses: actions/cache@v4
        with:
          path: .cache/oracle
          key: immich-go-v0.32.0-linux-x86-64-6e2ad86b
      - name: Fetch and verify the official oracle on cache miss
        run: python3 scripts/fetch-oracle.py
      - name: Build the exact release binary
        run: cargo build --locked --release -p immich-rs-cli
      - name: Migrate between and remove two isolated synthetic Immich stacks
        run: |
          mkdir -p .artifacts
          scripts/run-disposable-migration.sh \
            --binary target/release/immich-rs \
            --commit-sha "${{ github.sha }}" \
            --output ".artifacts/phase11-migration-${{ github.sha }}.json" \
            --oracle .cache/oracle/immich-go-0.32.0-linux-x86_64/immich-go \
            --benchmark-output ".artifacts/phase11-real-benchmark-${{ github.sha }}.json" \
            --samples 6 --warmups 2
          python3 scripts/check-migration-evidence.py \
            --input ".artifacts/phase11-migration-${{ github.sha }}.json"
          python3 scripts/check-real-migration-benchmark.py \
            --input ".artifacts/phase11-real-benchmark-${{ github.sha }}.json"
      - name: Preserve aggregate gate and raw benchmark evidence
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: phase11-disposable-migration-${{ github.sha }}
          path: |
            .artifacts/phase11-migration-${{ github.sha }}.json
            .artifacts/phase11-real-benchmark-${{ github.sha }}.json
          retention-days: 30
