---
name: phase8-disposable

on:
  workflow_dispatch:
  push:
    tags:
      - phase8-disposable-*

concurrency:
  group: immich-rs-phase8-disposable
  cancel-in-progress: false

jobs:
  phase8-disposable:
    runs-on: docker
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Restore the pinned Rust toolchain cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.rustup/toolchains/1.88.0-x86_64-unknown-linux-gnu
            ~/.rustup/update-hashes/1.88.0-x86_64-unknown-linux-gnu
          key: rustup-linux-x86-64-1.88.0
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Build the exact release binary
        run: cargo build --locked --release -p immich-rs-cli
      - name: Import and remove an isolated synthetic Takeout
        run: |
          mkdir -p .artifacts
          scripts/run-disposable-takeout.sh \
            --binary target/release/immich-rs \
            --commit-sha "${{ github.sha }}" \
            --output ".artifacts/phase8-takeout-${{ github.sha }}.json"
          python3 scripts/check-phase8-evidence.py \
            --input ".artifacts/phase8-takeout-${{ github.sha }}.json"
      - name: Preserve aggregate Takeout evidence
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: phase8-takeout-${{ github.sha }}
          path: .artifacts/phase8-takeout-${{ github.sha }}.json
          retention-days: 14
