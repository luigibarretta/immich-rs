[workspace]
members = [
  "crates/immich-cli",
  "crates/immich-client",
  "crates/immich-core",
  "crates/immich-sources",
]
resolver = "3"

[workspace.package]
version = "0.0.0"
authors = ["Luigi Barretta"]
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-only"
repository = "https://git.luigibarretta.com/luigibarretta/immich-rs"
homepage = "https://git.luigibarretta.com/luigibarretta/immich-rs"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
expect_used = "deny"
unwrap_used = "deny"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
