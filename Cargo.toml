[workspace]
members = [
  "crates/immich-application",
  "crates/immich-cli",
  "crates/immich-client",
  "crates/immich-core",
  "crates/immich-executor",
  "crates/immich-sources",
  "crates/immich-web",
]
resolver = "3"

[workspace.package]
version = "0.1.0-rc.1"
authors = ["Luigi Barretta"]
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-only"
repository = "https://git.luigibarretta.com/luigibarretta/immich-rs"
homepage = "https://git.luigibarretta.com/luigibarretta/immich-rs"

[workspace.dependencies]
ctrlc = "3.5.2"
base64 = "0.22.1"
futures-util = "0.3.31"
reqwest = { version = "0.12.23", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
rusqlite = { version = "0.37.0", features = ["bundled"] }
sha1 = "0.10.6"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
time = { version = "0.3.41", features = ["formatting", "parsing"] }
tokio = { version = "1.48.0", default-features = false, features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7.16", features = ["io"] }
toml = { version = "0.8.23", default-features = false, features = ["parse"] }
unicode-normalization = "0.1.24"
url = "2.5.4"
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
expect_used = "deny"
unwrap_used = "deny"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
