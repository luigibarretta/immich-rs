name: immich-rs

services:
  immich-rs:
    image: ${IMMICH_RS_IMAGE:-immich-rs:local}
    build:
      context: .
      dockerfile: Containerfile
      args:
        VERSION: ${IMMICH_RS_VERSION:-0.0.0}
        VCS_REF: ${IMMICH_RS_VCS_REF:-unknown}
    command: ["plan", "folder"]
    env_file:
      - ${IMMICH_RS_ENV_FILE:-./deploy/immich-rs.env.example}
    configs:
      - source: immich_rs_config
        target: /config/immich-rs.toml
    volumes:
      - type: bind
        source: ${IMMICH_RS_SOURCE_PATH:-./deploy/example-source}
        target: /source
        read_only: true
      - type: volume
        source: immich_rs_state
        target: /state
      - type: volume
        source: immich_rs_output
        target: /output
    network_mode: none
    read_only: true
    user: "65532:${IMMICH_RS_GID:-65532}"
    init: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid,nodev
    restart: "no"

configs:
  immich_rs_config:
    file: ${IMMICH_RS_CONFIG_PATH:-./deploy/immich-rs.example.toml}

volumes:
  immich_rs_state:
  immich_rs_output:
